name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint & type-check (Expo app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 13 # ratchet down as warnings get fixed
      - run: npx tsc --noEmit
