name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint & type-check (Expo app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 13 # ratchet down as warnings get fixed
      - run: npx tsc --noEmit

  edge-functions:
    name: Test edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test .
        working-directory: supabase/functions
